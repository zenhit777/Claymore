[package]
name = "claymore-memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
cuda-driver = ["dep:claymore-cuda", "claymore-cuda/cuda-driver"]

[dependencies]
claymore-cuda = { path = "../claymore-cuda", optional = true }
claymore-core = { path = "../claymore-core" }
claymore-device = { path = "../claymore-device" }
claymore-scheduler = { path = "../claymore-scheduler" }
claymore-tensor = { path = "../claymore-tensor" }
thiserror.workspace = true

[dev-dependencies]
# Real-checkpoint validation is a dev-only dependency: the memory crate never
# reads model weights on a normal build path.
claymore-model-gemma = { path = "../claymore-model-gemma" }

[[test]]
name = "hardware_cuda_memory"
path = "tests/hardware_cuda_memory.rs"
required-features = ["cuda-driver"]

[[test]]
name = "hardware_cuda_tensor"
path = "tests/hardware_cuda_tensor.rs"
required-features = ["cuda-driver"]

[[test]]
name = "hardware_m10_primitives"
path = "tests/hardware_m10_primitives.rs"
required-features = ["cuda-driver"]
