name: Rust CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format, test, and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --workspace --all-targets
      - name: Check optional CUDA feature without linking or requiring a GPU
        run: |
          cargo check -p claymore-cuda --features cuda-driver --all-targets
          cargo check -p claymore-memory --features cuda-driver --all-targets
          cargo check -p claymore-cli --features cuda-driver
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Clippy with optional CUDA feature
        run: cargo clippy -p claymore-cuda -p claymore-memory -p claymore-cli --features cuda-driver --all-targets -- -D warnings

  msrv:
    name: Minimum supported Rust 1.86
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
      - name: Verify workspace on the declared MSRV
        run: cargo test --workspace --all-targets
      - name: Check CUDA feature and hardware test targets on the declared MSRV
        run: |
          cargo check -p claymore-cuda --features cuda-driver --all-targets
          cargo check -p claymore-memory --features cuda-driver --all-targets
          cargo check -p claymore-cli --features cuda-driver
